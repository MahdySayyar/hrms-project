{% extends 'base.html' %}
{% block content %}
<div class="page-heading"><div><h1>{{ title }}</h1>{% if target_name %}<p class="muted">حساب {{ target_name }}</p>{% endif %}</div></div>
<section class="panel form-panel narrow-form">
  <form method="post" action="{{ action }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field"><label for="current_password">{{ 'رمز فعلی مدیر' if target_name else 'رمز فعلی' }}</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required dir="ltr"></div>
    <div class="field"><label for="new_password">رمز جدید (حداقل ۱۲ نویسه)</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required dir="ltr"></div>
    <div class="field"><label for="password_confirmation">تکرار رمز جدید</label><input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required dir="ltr"></div>
    <div class="form-actions"><button type="submit" class="button primary">{{ title }}</button></div>
  </form>
</section>
{% endblock %}
