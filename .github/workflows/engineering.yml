name: HRMS engineering checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  docker-startup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compose: compose.capacity.yaml
            launcher_args: '4'
          - compose: compose.shared.yaml
            launcher_args: '4 shared'
    env:
      HRMS_CI_COMPOSE: ${{ matrix.compose }}
      COMPOSE_PROJECT_NAME: hrms-demo-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract clean source ZIP
        run: |
          git archive --format=zip HEAD -o "$RUNNER_TEMP/hrms-source.zip"
          unzip -q "$RUNNER_TEMP/hrms-source.zip" -d "$RUNNER_TEMP/hrms-source"
      - name: Start downloaded project without host Python
        run: bash "$RUNNER_TEMP/hrms-source/scripts/start-docker.sh" ${{ matrix.launcher_args }}
      - name: Verify health, login form and repeat initialization
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hrms-source"
          curl --fail --silent http://localhost:8001/health | grep -q '"status":"ok"'
          curl --fail --silent http://localhost:8001/login | grep -q 'id="username"'
          before=$(sha256sum .runtime/docker-hrms-secrets/*)
          docker compose -f "deployments/$HRMS_CI_COMPOSE" --profile tools run --rm --no-deps init-secrets
          after=$(sha256sum .runtime/docker-hrms-secrets/*)
          test "$before" = "$after"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify account, leave review and reporting demo
        run: |
          cd "$RUNNER_TEMP/hrms-source"
          python -m pip install 'httpx==0.28.1'
          python scripts/verify_delivery_demo_20261117.py --output "$RUNNER_TEMP/demo.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: delivery-demo-${{ matrix.compose }}
          path: ${{ runner.temp }}/demo.json
      - name: Stop CI containers
        if: always()
        run: |
          compose="$RUNNER_TEMP/hrms-source/deployments/$HRMS_CI_COMPOSE"
          if [ -f "$compose" ]; then docker compose -f "$compose" down --volumes; fi
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hrms_ci
          POSTGRES_USER: synthetic_ci
          POSTGRES_PASSWORD: disposable-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic_ci -d hrms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://synthetic_ci:disposable-ci-only-password@127.0.0.1:5432/hrms_ci
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pip check
      - name: Core contracts and architecture coverage
        run: python -m coverage run --source app/request_workflow --data-file artifacts/ci/coverage scripts/run_core_checks.py --phase after --pattern "test_*.py" --output artifacts/ci/core.json
      - run: python -m coverage report --data-file artifacts/ci/coverage --fail-under=80
      - run: python -m coverage json --data-file artifacts/ci/coverage -o artifacts/ci/coverage.json
      - run: python scripts/check_engineering.py --output artifacts/ci/doc-checks.json
      - run: npm install --prefix artifacts/diagram-validator --ignore-scripts --no-audit --no-fund mermaid@11 jsdom@26
      - run: node scripts/validate_diagrams.mjs --output artifacts/ci/diagram-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-core-evidence
          path: artifacts/ci/
