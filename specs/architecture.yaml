id: ARCH-SPEC-01
version: 1
status: specified_before_boundary_hardening_pending_human_review
current_audit:
  recorded_at: '2026-11-17'
  report: docs/05-architecture/current-architecture-review-20261117.md
  provenance: Existing application/deployment reconstructed from code; ADR-11/12/13 and use-case/design updates recorded before these new read changes
  read_changes: [ADR-11, ADR-12, ADR-13]
  topology_change: None; single-process baseline and process-local sessions preserved
  data_migration: None
deployment: single native FastAPI process + local PostgreSQL
docker_login_capacity:
  recorded_at: '2026-11-17'
  provenance: ADR-15/16/17 and FR/BR/UC/design were specified before each corresponding implementation; current deployment promoted after successful isolated login experiment
  deployment: Four single-process web containers, one explicit affinity proxy and PostgreSQL with the existing volume
  configuration: deployments/compose.capacity.yaml
  password_work: One private CPU worker and at most 512 outstanding checks per web; no database session held during hash
  database_budget: At most 10 pooled connections per web, total 40; final account revalidation/audit uses a short row lock
  credentials: Ignored local secrets preserved; only primary web seeds; secondary workers use --web-only
  evidence: docs/08-testing/evidence/login500-fourweb-after-20261117-c.json
  live_deployment: docs/08-testing/evidence/login500-live-deployment-20261117-a.json
  result: 500 distinct successful logins and cookies; 830 successful observer probes; zero restart; full burst about 107 seconds on the measured host
  limitation: Same physical host; process-local sessions and worker failure/session loss remain; no mixed 300-second NFR or HA certification
docker_baseline:
  provenance: ADR-10 specified before implementation on 2026-11-16 after direct user request
  deployment: One Uvicorn web container and one PostgreSQL container in a dedicated Compose project
  web_port: localhost:8001
  database: Dedicated named volume with synthetic seed only; no host database port or native HR migration
  credentials: Fresh ignored runtime secret files; never image layers or copied native .env
  sessions: In-memory inside the single web process; restart loses sessions
  acceptance: Healthy containers, synthetic login/core workflows and volume persistence; no 500-user or HA claim
  downloadable_startup:
    decision: ADR-14
    prerequisites: Docker with Linux containers and Compose v2; no host Python required
    initializer: Temporary tools-profile container; network disabled; only initializer script and dedicated secret directory mounted
    invariant: Existing secrets and database volume preserved; unchanged single web process
capacity_lab:
  deployment: Four isolated native web processes, an async affinity proxy and disposable PostgreSQL schema
  decisions: [ADR-07, ADR-08]
  session_storage: Process-local, dependent on browser affinity; worker failure loses its sessions
  production_status: Original single-process launcher remains in use; lab is not HA
governed_module: request decisions only
layers:
- name: route
  file: app/modules.py
  symbol: review_request
  responsibility: form/session/CSRF/error translation
- name: domain
  file: app/request_workflow/domain.py
  responsibility: role/input/state rules
  forbidden_dependencies:
  - fastapi
  - sqlalchemy
  - database
  - hr_models
  - repository
  - service
- name: service
  file: app/request_workflow/service.py
  responsibility: workflow/transaction orchestration through injected repository and
    clock
  forbidden_dependencies:
  - fastapi
  - sqlalchemy
  - database
  - hr_models
  - access
  - security
- name: repository
  file: app/request_workflow/repository.py
  responsibility: PostgreSQL reads/locks/decision and audit writes
invariants:
- same UC-02 browser responses and lock order
- request lock before employee lock
- decision and audit share transaction
- default clock uses standard library UTC, not ORM module
tests:
- TC-M-01
- TC-M-02
- TC-02-02
- TC-02-07
- TC-02-08
decision: ADR-04
