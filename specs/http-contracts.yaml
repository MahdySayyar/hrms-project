id: HTTP-CAT-01
version: 1
status: reconstructed_browser_contracts_pending_review
notes:
- Browser operations return HTML, redirects or CSV; they are not JSON CRUD endpoints
- POST is form-urlencoded or multipart with session-bound csrf_token
- Missing session redirects to login with 303 for protected routes
- FastAPI path/query validation can additionally return framework 422
- Unexpected persistence failure is a server 500; this is not a new typed JSON API
- All routes are inventoried by export_engineering_artifacts.py; generic forms are
  exported from MODULES
contracts:
- id: API-01
  use_case: UC-01
  operations:
  - method: GET
    path: /login
    success:
    - 200
    - 303
    auth: optional
    side_effect: Issue an anonymous cookie and CSRF if absent
  - method: POST
    path: /login
    auth: anonymous_session_csrf
    fields:
      username:
        type: string
        required: true
      password:
        type: string
        required: true
      csrf_token:
        type: string
        required: true
    success:
    - 303
    errors:
    - 401
    - 403
    - 500
    - 503
    overload: ADR-16; private password work capacity full, Retry-After=2 and no login audit/session
    redirect: /
  - method: POST
    path: /logout
    auth: active_session_csrf
    fields:
      csrf_token:
        type: string
        required: true
    success:
    - 303
    errors:
    - 403
    - 500
    redirect: /login
- id: API-02
  use_case: UC-02
  operations:
  - method: POST
    path: /hr/{module}/new
    module_subset:
    - leave
    - travel
    - administrative
    auth: hr_or_admin_scope_csrf
    fields_from: app/module_forms.py#MODULES
    success:
    - 303
    errors:
    - 400
    - 403
    - 404
    - 500
    redirect: /hr/{module}/{record_id}?saved=1
  - method: POST
    path: /requests/{request_id}/review
    auth: admin_csrf
    fields:
      decision:
        type: string
        enum:
        - approved
        - rejected
        required: true
      review_notes:
        type: string
        maxLength: 3000
        required: false
      csrf_token:
        type: string
        required: true
    success:
    - 303
    errors:
    - 400
    - 403
    - 404
    - 409
    - 500
    conditions:
      rejection_reason: nonblank review_notes required for rejected
      same_final_decision: 303; original decision/notes/audit preserved
      opposite_final_decision: 409; original preserved
      overlap: 400; inclusive approved leave/travel intersection
    redirect: /hr/{kind}/{request_id}?saved=1
- id: API-03
  use_case: UC-03
  operations:
  - method: GET
    path: /payroll
    auth: admin
    success:
    - 200
    errors:
    - 403
  - method: POST
    path: /payroll/calculate
    auth: admin_csrf
    fields:
      employee_id:
        type: integer
        required: true
      period:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
        required: true
      csrf_token:
        type: string
        required: true
    success:
    - 303
    errors:
    - 400
    - 403
    - 404
    - 500
    conditions:
      calendar: Gregorian month, actual month validity checked
      existing_snapshot: Return existing id without recalculation
    redirect: /payroll/{payslip_id}
  - method: GET
    path: /payroll/{payslip_id}
    auth: admin_scope
    success:
    - 200
    errors:
    - 403
    - 404
- id: API-04
  use_case: UC-04
  operations:
  - method: GET
    path: /employees
    auth: hr_or_admin_scope
    success:
    - 200
    query:
    - q
    - branch
    - unit
    - status
    - page
    - page_size
  - method: GET
    path: /hr/{module}
    auth: Existing module hr/admin or admin_only and organizational scope
    query: [q, status, page, page_size]
    success: [200]
    errors: [400, 403, 404]
    conditions:
      catalog: Existing filtered count and bounded page; display references read from that page only under ADR-11
      paging: Default page 1 and size 50; size 1..100; invalid input 400
  - method: GET
    path: /employees/{employee_id}
    auth: hr_or_admin_scope
    success:
    - 200
    errors:
    - 403
    - 404
  - method: POST
    path: /employees/new
    auth: hr_or_admin_scope_csrf
    fields_from: templates/employee_form.html
    success:
    - 303
    errors:
    - 400
    - 403
    - 500
  - method: POST
    path: /employees/{employee_id}/edit
    auth: hr_or_admin_scope_csrf
    fields_from: templates/employee_form.html
    success:
    - 303
    errors:
    - 400
    - 403
    - 404
    - 500
  - method: POST
    path: /employees/{employee_id}/status
    auth: hr_or_admin_scope_csrf
    fields:
      active:
        type: string
        enum:
        - 'true'
        - 'false'
        required: true
      csrf_token:
        type: string
        required: true
    success:
    - 303
    errors:
    - 400
    - 403
    - 404
