    direct_user_scope: Run containers in Docker; shared-container EXP-01 is not claimed to have been performed
  - id: EXP-03
    change: Replicas and load balancing in an isolated Kubernetes cluster
    status: pending
  - id: EXP-04
    change: Pod failure and persistent database recovery
    status: pending
  - id: EXP-05
