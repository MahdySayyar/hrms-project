id: UC-01
version: 4
name: Authenticate and end an active account session
status: reconstructed_from_current_code_pending_student_review
requirements:
- FR-01
- FR-02
- FR-03
- FR-25
business_rules:
- BR-01
- BR-02
- BR-03
primary_actor: admin_or_hr_or_viewer
trigger: Submit the login form
password_management:
  change: Active user supplies the current and new password with confirmation and CSRF
  recovery: Active administrator reauthenticates to reset another account; role and activation stay as stored
  success: New Argon2id hash and audit commit together; earlier authenticated sessions are invalid on next use
  login_throttle: Five failed checks per active account trigger a five-minute lockout shared across web replicas; no extension during lockout
registration:
  entry: GET /register from the sign-in page; POST /register with anonymous session CSRF
  validation: Unique normalized username of 3–50 Latin letters, digits, dots, hyphens or underscores; display name of 1–100 characters; password of 12–128 characters and matching confirmation
  success: Persist an active member with an Argon2id hash and an audit record; redirect to login and allow immediate sign-in to the personal account page
  failures: Invalid fields 400, duplicate username 409, invalid CSRF 403, full password queue 503; no account or audit on failure
  access: The public form cannot assign an organizational role; existing inactive accounts remain inactive
preconditions:
- The login page has issued an anonymous session and a CSRF token
input:
  username: normalized nonempty account name
  password: unchanged password string
  csrf_token: token bound to the current session
main_flow:
- Check CSRF before authenticating
- Read the active account and release the database session before private queued password verification
- Verify Argon2id or legacy PBKDF2 with the stored parameters; prepare an Argon2id replacement for a successfully verified legacy hash outside the database transaction
- After a matching password, recheck the current CSRF session and the active account with the same hash before auditing
- Prepare any verified legacy hash replacement and audit, atomically rotate the still-present anonymous session, then commit SQL; delete unissued new token if commit fails
- Issue the new authenticated cookie only after audit commit; expired or revoked anonymous session cannot be revived
- Redirect to the dashboard
- On logout, validate CSRF, record audit, invalidate session and remove the cookie
alternatives:
- condition: shared_session_store_unavailable
  response: Persian 503 with Retry-After; no memory fallback and no authenticated cookie
- condition: private_password_capacity_full
  response: 503 Persian login form with Retry-After=2; no login audit or authenticated session
- condition: account_deleted_deactivated_or_hash_changed_during_password_check
  response: 401 generic login message; no login audit or authenticated session
- condition: csrf_session_expires_or_is_discarded_during_password_check
  response: 403; no login audit or authenticated session
- condition: invalid_credentials_or_inactive_account
  response: 401 with a generic Persian login message
- condition: missing_or_invalid_csrf
  response: 403 with no authentication state change
- condition: protected_page_without_valid_session
  response: 303 redirect to /login
- condition: authenticated_role_lacks_permission
  response: 403; an out-of-scope employee is concealed with 404
success:
- A rotated HttpOnly, SameSite=Lax session cookie exists
- The assigned role and organizational scope govern subsequent requests
failure:
- No authenticated session is granted
limitations:
- Default Docker uses memory and affinity; Redis and per-request balancing are available in an optional Docker configuration
- Multiple physical servers unavailable; no subsecond 500-login or complete HA guarantee
- Memory sessions disappear on web restart; shared sessions survive web restart and are lost on Redis restart
- COOKIE_SECURE is false for the localhost HTTP development environment
- Docker baseline retains one web process, the same opaque cookie/CSRF contract and process-local session loss on restart
- Successful login is audited; a comprehensive denied-access security log is a future
  requirement
