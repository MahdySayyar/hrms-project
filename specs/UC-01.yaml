id: UC-01
version: 3
name: Authenticate and end an active account session
status: reconstructed_from_current_code_pending_student_review
requirements:
- FR-01
- FR-02
- FR-03
business_rules:
- BR-01
- BR-02
- BR-03
primary_actor: admin_or_hr_or_viewer
trigger: Submit the login form
preconditions:
- The login page has issued an anonymous session and a CSRF token
input:
  username: normalized nonempty account name
  password: unchanged password string
  csrf_token: token bound to the current session
main_flow:
- Check CSRF before authenticating
- Read the account and verify its active flag and PBKDF2 password hash
- Persist the login audit entry
- Discard the anonymous session and issue a new authenticated session
- Redirect to the dashboard
- On logout, validate CSRF, record audit, invalidate session and remove the cookie
alternatives:
- condition: invalid_credentials_or_inactive_account
  response: 401 with a generic Persian login message
- condition: missing_or_invalid_csrf
  response: 403 with no authentication state change
- condition: protected_page_without_valid_session
  response: 303 redirect to /login
- condition: authenticated_role_lacks_permission
  response: 403; an out-of-scope employee is concealed with 404
success:
- A rotated HttpOnly, SameSite=Lax session cookie exists
- The assigned role and organizational scope govern subsequent requests
failure:
- No authenticated session is granted
limitations:
- Sessions are process-local and disappear on restart
- COOKIE_SECURE is false for the localhost HTTP development environment
- Docker baseline retains one web process, the same opaque cookie/CSRF contract and process-local session loss on restart
- Successful login is audited; a comprehensive denied-access security log is a future
  requirement
traceability:
  models:
  - SEQ-01
  - ACT-01
  - ST-01
  - DM-01
  design: D-01
  api: API-01
  code:
  - app/main.py#login
  - app/main.py#logout
  - app/security.py
  - app/access.py
  tests:
  - TC-01-01
  - TC-01-02
  - TC-01-03
goal: Grant an active account a scoped authenticated session and end it safely
secondary_actors: []
quality_attributes:
- NFR-S-01
- NFR-S-02
request_authentication_contract:
  recorded_at: '2026-11-12'
  provenance: ADR-06 and D-01 were specified before code; this UC detail was recorded immediately after the small implementation
  active_account: Read PostgreSQL once for every new protected HTTP request
  repeated_checks: Reuse only within the same HTTP request and same still-valid session
  async_form_dependencies: Run synchronous authentication SQL in Starlette thread pool
native_cluster_contract:
  provenance: Specified before ADR-07 implementation on 2026-11-12
  affinity: Optional native proxy keeps each browser on one web process using a non-authenticating HttpOnly cookie
  session: Existing opaque session and CSRF rules remain in the selected web process
  dependency_failure: HTTP 503 Persian response; mutations are never automatically retried by proxy
  limitation: Worker/restart session loss remains; this is not shared sessions or HA
  transport_revision:
    recorded_at: '2026-11-15'
    provenance: ADR-08 and this contract specified before transport implementation
    outgoing_client: Shared aiohttp ClientSession; disabled cookie jar, redirects and automatic decompression
    forwarding: Preserve method, query, body and separate Set-Cookie headers; remove hop-by-hop and Connection-nominated headers
    failures: Preserve Persian 503 and do not retry a mutation after transport failure
