goal: Grant an active account a scoped authenticated session and end it safely
compose_replica_experiment:
  specified_at: '2026-11-17'
  decision: ADR-15
  status: Default Docker launcher uses four single-process web replicas; the native and single-web Docker launchers remain available
  workers: Four explicit internal Compose web services; per-browser affinity required for process-local sessions
  proxy_contract: Explicit internal HTTP:8000 allowlist; bounded timeout; no automatic mutation retry; cookie and CSRF preserved
  proxy_forwarding: Forward the encoded path and query as received; preserve valid upstream length metadata for HEAD and 304 and omit body length on 204.
  compose_connection_policy: ADR-17; force-close each outgoing HTTP connection, no retry of any method, sanitized error-class/method/worker logging
password_work_contract:
  specified_at: '2026-11-17'
  decision: ADR-16
  workers: Private executor, 1 per web by default; 1..4 allowed; total outstanding work bounded to 512 per web
  database: Short snapshot read, closed during hash and queue; current active/hash revalidated in the audit transaction
  invariants: No password/result cache; rotate conditionally before SQL commit and issue cookie after commit; remove the unissued token on commit failure
memory_expiry_maintenance: ADR-23; throttle full expiry sweeps to one per 30 seconds during activity and always reject expired tokens at lookup or rotation.
secondary_actors: []
quality_attributes:
- NFR-S-01
- NFR-S-02
new_login_experiments:
  specified_at: '2026-11-17'
  decisions: [ADR-18, ADR-19]
  password: Argon2id m19456 t2 p1; legacy rehash only after successful verification and revalidation, committed with audit
  sessions: Redis shared store with token digests and TTL; cross-worker validity/revocation; conditional rotation; no fallback on failure
  proxy: Per-request round robin in the explicit shared-session deployment; legacy affinity preserved in existing modes
  status: Tested on one Docker host; subsecond login goal and human review pending
request_authentication_contract:
  recorded_at: '2026-11-12'
  provenance: ADR-06 and D-01 were specified before code; this UC detail was recorded immediately after the small implementation
  active_account: Read PostgreSQL once for every new protected HTTP request
  repeated_checks: Reuse only within the same HTTP request and same still-valid session
  async_form_dependencies: Run synchronous authentication SQL in Starlette thread pool
native_cluster_contract:
  provenance: Specified before ADR-07 implementation on 2026-11-12
  affinity: Optional native proxy keeps each browser on one web process using a non-authenticating HttpOnly cookie
  session: Existing opaque session and CSRF rules remain in the selected web process
  dependency_failure: HTTP 503 Persian response; mutations are never automatically retried by proxy
  limitation: Worker/restart session loss remains; this is not shared sessions or HA
  transport_revision:
    recorded_at: '2026-11-15'
    provenance: ADR-08 and this contract specified before transport implementation
    outgoing_client: Shared aiohttp ClientSession; disabled cookie jar, redirects and automatic decompression
    forwarding: Preserve method, query, body and separate Set-Cookie headers; remove hop-by-hop and Connection-nominated headers
    failures: Preserve Persian 503 and do not retry a mutation after transport failure
