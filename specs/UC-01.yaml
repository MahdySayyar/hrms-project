id: UC-01
version: 3
name: Authenticate and end an active account session
status: reconstructed_from_current_code_pending_student_review
requirements:
- FR-01
- FR-02
- FR-03
business_rules:
- BR-01
- BR-02
- BR-03
primary_actor: admin_or_hr_or_viewer
trigger: Submit the login form
preconditions:
- The login page has issued an anonymous session and a CSRF token
input:
  username: normalized nonempty account name
  password: unchanged password string
  csrf_token: token bound to the current session
main_flow:
- Check CSRF before authenticating
- Read the account and verify its active flag and PBKDF2 password hash
- Release the account-reading database session before private queued PBKDF2 work; preserve the stored iteration count
- After a matching password, recheck the current CSRF session and the active account with the same hash before auditing
- Persist the login audit entry
- Discard the anonymous session and issue a new authenticated session
- Redirect to the dashboard
- On logout, validate CSRF, record audit, invalidate session and remove the cookie
alternatives:
- condition: private_password_capacity_full
  response: 503 Persian login form with Retry-After=2; no login audit or authenticated session
- condition: account_deleted_deactivated_or_hash_changed_during_password_check
  response: 401 generic login message; no login audit or authenticated session
- condition: csrf_session_expires_or_is_discarded_during_password_check
  response: 403; no login audit or authenticated session
- condition: invalid_credentials_or_inactive_account
  response: 401 with a generic Persian login message
- condition: missing_or_invalid_csrf
  response: 403 with no authentication state change
- condition: protected_page_without_valid_session
  response: 303 redirect to /login
- condition: authenticated_role_lacks_permission
  response: 403; an out-of-scope employee is concealed with 404
success:
- A rotated HttpOnly, SameSite=Lax session cookie exists
- The assigned role and organizational scope govern subsequent requests
failure:
- No authenticated session is granted
limitations:
- Sessions are process-local and disappear on restart
- COOKIE_SECURE is false for the localhost HTTP development environment
- Docker baseline retains one web process, the same opaque cookie/CSRF contract and process-local session loss on restart
- Successful login is audited; a comprehensive denied-access security log is a future
  requirement
traceability:
  models:
  - SEQ-01
  - ACT-01
  - ST-01
  - DM-01
  design: D-01
  api: API-01
  code:
  - app/main.py#login
  - app/main.py#logout
  - app/security.py
  - app/access.py
  tests:
  - TC-01-01
  - TC-01-02
  - TC-01-03
  - TC-01-10
  - TC-01-11
  - TC-01-12
  - TC-01-13
  - TC-01-14
  - TC-01-15
