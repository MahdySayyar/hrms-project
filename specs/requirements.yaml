  decision: ADR-11
  requirements: [FR-08, FR-09, FR-11, FR-12, FR-15, FR-17, FR-18, FR-19, FR-20, FR-25]
  acceptance: Resolve display references only from the authorized filtered page; at most one projected SELECT per reference model; preserve labels/order/escaping and see renames on the next HTTP request.
