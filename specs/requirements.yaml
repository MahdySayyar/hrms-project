business_rules:
- id: BR-01
  name: Only active valid accounts authenticate
  concurrent_login_rule: ADR-16; an account deactivated/deleted or with a changed hash during queued password work must not authenticate from the older snapshot.
  rule: حساب فعال، hash صحیح و token نشست منقضی‌نشده لازم است؛ وضعیت حساب در هر HTTP request تازه از پایگاه بررسی شود و تکرار داخلی همان request نیازمند خواندن دوباره نیست.
  requirements:
  - FR-01
  - FR-03
  code:
  - app/security.py#require_login
  - app/main.py#login
  source:
  - SRC-C01
  status: reconstructed_pending_review
