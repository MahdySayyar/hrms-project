nonfunctional_requirements:
- id: NFR-01
  name: Response time
  criterion: p95 < 2000ms; error fraction < 0.01; 500 authenticated concurrent users;
    10000 employees; 80/20 read/write workload; 5 minutes steady after ramp
  source:
  - SRC-S01
  - SRC-S02
  status: proposed_not_verified
  evidence:
  - docs/08-testing/evidence/native-load.json
  - docs/08-testing/evidence/capacity-native4-500-before-20261115-a.json
  transport_experiment:
    specified_at: '2026-11-15'
    decision: ADR-08
    scope: Preserve FR-01, BR-01 and BR-02 authentication behavior while reducing isolated proxy transport cost
    acceptance: Full 500-user 300-second steady protocol; exploratory runs alone do not verify this NFR
  limitation: 10-user/20-second run does not meet acceptance conditions; 300ms food-order
    example is not an HR requirement
- id: NFR-P-02
  name: Concurrent workload
  criterion: 500 authenticated users complete the defined read/write workload without
    incorrect scope, lost writes or duplicate transitions
  source:
  - SRC-S02
  status: proposed_not_verified
  evidence: []
- id: NFR-S-01
  name: Authorization
  criterion: Every protected capability follows the role/scope matrix; negative role
    and scope samples all rejected
  source:
  - SRC-C01
  - SRC-S02
  status: partially_verified
  tests:
  - TC-01-02
- id: NFR-S-02
  name: Browser security
  criterion: All mutation forms validate session CSRF; session cookie is HttpOnly/SameSite=Lax;
    non-static pages no-store and self CSP
  source:
  - SRC-C01
  status: partially_verified
  tests:
  - TC-01-01
  limitation: No full OWASP scan, TLS or login rate limiting yet
- id: NFR-AU-01
  name: Audit atomicity
  criterion: Each changed request decision has one actor/time audit; identical retry
    none; injected audit failure leaves no decision
  source:
  - SRC-S02
  - SRC-C01
  status: verified_for_request_decisions
  tests:
  - TC-02-02
  - TC-02-04
  - TC-02-08
- id: NFR-A-01
  name: Availability
  criterion: 99.5% during a defined 30-day service window, measured by external probes
  source:
  - SRC-S02
  status: proposed_not_verified
  limitation: Service hours and real SLA remain unconfirmed; one local host is not
    HA
- id: NFR-M-01
  name: Internal architecture boundary
  criterion: Request decision domain and service import no HTTP/ORM/persistence module;
    route delegates decision rules and SQL
  source:
  - SRC-S02
  status: verified_for_request_module_pending_human_review
  tests:
  - TC-M-01
  - TC-M-02
  evidence:
  - docs/08-testing/evidence/all-tests-final.json
- id: NFR-T-01
  name: Measured test coverage
  criterion: At least 80% statement coverage in the explicitly governed package app/request_workflow,
    with positive/negative/boundary tests; report scope and uncovered lines
  source:
  - SRC-S02
  status: measured_request_package_threshold_passed
  limitation: This target does not claim 80% coverage of the whole HRMS
  evidence:
