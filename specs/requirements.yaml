- id: FR-01
  name: Authenticate
  acceptance: حساب فعال با رمز صحیح وارد شود؛ ورودی نادرست 401 و CSRF نامعتبر 403.
  compose_login_experiment: ADR-15; 500 independent concurrent login attempts with browser affinity, successful audit/session rotation and responsive observer; lab acceptance precedes deployment promotion.
  password_capacity_contract: ADR-16; unchanged PBKDF2 in a private bounded executor without a database session; recheck active/hash and CSRF before audit/rotation; full capacity returns 503 with Retry-After and no session/audit.
  compose_transport_contract: ADR-17; separate outgoing connection per request without retry; current account locked only during final revalidation/audit transaction
  use_case: UC-01
  business_rules:
  - BR-01
  - BR-02
  code:
  - app/main.py#login
  core_tests:
  - TC-01-01
  - TC-01-03
