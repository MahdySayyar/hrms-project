      x-code-symbol: app/main.py#instance
  /login:
    get:
      summary: Login Page
      operationId: login_page_login_get
      responses:
        '200':
          description: Rendered Persian HTML page
          content:
            text/html:
              schema:
                type: string
      x-code-symbol: app/main.py#login_page
      x-hrms-contracts:
      - id: API-01
        method: GET
        path: /login
        success:
        - 200
        - 303
        auth: optional
        side_effect: Issue an anonymous cookie and CSRF if absent
    post:
      summary: Login
      operationId: login_login_post
      responses:
        '303':
          description: Successful form submission or documented retry; follow Location
          headers:
            Location:
              schema:
                type: string
        '403':
          description: Documented browser error 403; see x-hrms-contracts conditions
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Documented browser error 401; see x-hrms-contracts conditions
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Unexpected persistence/server failure
      x-code-symbol: app/main.py#login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                csrf_token:
                  type: string
              required:
              - username
              - password
              - csrf_token
          multipart/form-data:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                csrf_token:
                  type: string
              required:
              - username
              - password
              - csrf_token
      x-form-inventory: See route-inventory.json and specs/http-contracts.yaml for
        full or dynamic form fields
      x-hrms-contracts:
      - id: API-01
        method: POST
        path: /login
        auth: anonymous_session_csrf
        fields:
          username:
            type: string
            required: true
          password:
            type: string
            required: true
          csrf_token:
            type: string
            required: true
        success:
        - 303
        errors:
        - 401
        - 403
        - 500
        redirect: /
