  description: 'Current HRMS browser contracts: HTML/forms/cookie/redirects. Exported
    offline; the runtime OpenAPI endpoint is disabled.'
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '503':
          description: PostgreSQL connection unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: unavailable
      x-code-symbol: app/main.py#health
  /instance:
    get:
