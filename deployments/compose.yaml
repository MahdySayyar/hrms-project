name: hrms-docker

services:
  init-secrets:
    profiles: [tools]
    image: python:3.12-slim-bookworm
    network_mode: none
    volumes:
      - ../scripts/init_docker_secrets.py:/bootstrap/scripts/init_docker_secrets.py:ro
      - ../.runtime/docker-hrms-secrets:/bootstrap/.runtime/docker-hrms-secrets
    command: [python, /bootstrap/scripts/init_docker_secrets.py]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrms_docker
      POSTGRES_USER: hrms_docker
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_docker -d hrms_docker"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    image: hrms-web:docker-baseline
    build:
      context: ..
      dockerfile: deployments/app/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: hrms_docker
      DB_USER: hrms_docker
      DB_PASSWORD_FILE: /run/secrets/db_password
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      ADMIN_USERNAME: hradmin
      ADMIN_DISPLAY_NAME: مدیر نمونهٔ Docker
      INSTANCE_ID: hrms-docker-1
      COOKIE_SECURE: "false"
      HRMS_THREADS: "40"
      HRMS_DB_POOL_SIZE: "5"
      HRMS_DB_MAX_OVERFLOW: "10"
    secrets:
      - db_password
      - admin_password
    ports:
      - "127.0.0.1:${HRMS_HTTP_PORT:-8001}:8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert r.status == 200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  backend:

volumes:
  postgres_data:

secrets:
  db_password:
    file: ../.runtime/docker-hrms-secrets/db_password
  admin_password:
    file: ../.runtime/docker-hrms-secrets/admin_password
